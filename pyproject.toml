[project]
name = "sportshub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "typing>=3.10.0.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
sportshub = "sportshub:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
